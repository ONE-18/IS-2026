
services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "81:81"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./html2:/usr/share/nginx/html2:ro
      - ./sitios_nginx:/etc/nginx/conf.d:ro
      - ./configuracion_nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  flask:
    image: gunicornflask:1.0
    container_name: hola-flask
    restart: unless-stopped